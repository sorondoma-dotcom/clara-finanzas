# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: clara-cuentas
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clara-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # URL HTTPS exacta del servicio, sin barra final (p. ej. https://clara-cuentas.onrender.com)
      - key: APP_ORIGIN
        sync: false
      # El balanceador de Render termina TLS y reenvía X-Forwarded-Proto/For.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: clara-db
    databaseName: clara
    user: clara
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []
